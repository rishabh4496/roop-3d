[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roop-3d"
version = "0.1.0"
description = "Isolated local Roop 3D service"
requires-python = ">=3.10,<3.13"
dependencies = [
  "moderngl==5.12.0",
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.10.6", "websockets==15.0.1",
  "scipy==1.15.3", "av==17.1.0", "numpy==1.26.4", "opencv-python-headless==4.11.0.86",
  "onnxruntime-gpu==1.23.2; platform_system != 'Darwin'",
  "onnxruntime==1.23.2; platform_system == 'Darwin'",
  "PyYAML==6.0.3", "httpx==0.28.1", "onnx==1.16.0", "python-multipart==0.0.32",
  "pillow==12.3.0",
]

[project.optional-dependencies]
lip-sync = ["librosa==0.11.0", "scipy>=1.13,<2"]
live-studio = ["pyvirtualcam>=0.13,<1", "mss>=10,<11", "SpoutGL>=0.0.7; platform_system == 'Windows'"]
test = ["pytest==9.1.1"]
diffusion = ["diffusers==0.30.2"]
gpu-compositor = ["torch==2.7.1"]
# GPU JPEG (nvJPEG) for the binary live-preview stream; without it the hub falls back to libjpeg-turbo.
live-nvjpeg = ["torchvision==0.22.1", "pillow>=10"]
nv-video = ["PyNvVideoCodec==2.2.3"]
cvcuda = ["cvcuda-cu12==0.19.0; platform_system == 'Linux'"]
trt = ["tensorrt-cu12==10.9.0.34; platform_system != 'Darwin'"]
flame = ["smplx==0.1.28"]
dense-face-export = ["torch==2.7.1", "torchvision==0.22.1", "timm==0.9.16"]
articulated-reconstruction = ["torch==2.7.1"]
provenance = ["c2pa-python==0.38.0"]

[tool.setuptools]
packages = ["roop_3d", "roop_3d.audit", "roop_3d.core", "roop_3d.server", "roop_3d.models", "roop_3d.faceset", "roop_3d.media", "roop_3d.engine", "roop_3d.engine.detection", "roop_3d.engine.volumetric", "roop_3d.engine.diffusion", "roop_3d.engine.audio_sync", "roop_3d.reconstruction", "roop_3d.compositor", "roop_3d.bridges", "roop_3d.jobs", "roop_3d.reliability", "roop_3d.tools", "roop_3d.async_pipeline"]
package-dir = {"roop_3d" = "."}

[tool.setuptools.package-data]
roop_3d = ["py.typed", "reconstruction/ARTICULATED_MODELS_LICENSE", "reconstruction/ARTICULATED_MODELS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = "--import-mode=importlib --basetemp=roop_3d/.runtime/pytest"
